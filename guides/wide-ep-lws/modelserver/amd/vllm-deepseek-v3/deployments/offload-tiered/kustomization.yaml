apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# DeepSeek-V3 on AMD Instinct, 2P2D wide-EP, with CPU + NVMe tiered KV-cache offloading on
# prefill. Composes the providers/amd-ci fabric overlay (copy and re-point for another cluster)
# with the offloading-tiered component. Requires local NVMe on the prefill nodes at the hostPath
# the base nvme-cache volume points to (/mnt/local/kv-cache); use offload-cpu where there is none.
resources:
  - ../../providers/amd-ci
components:
  - ../../components/offloading-tiered
