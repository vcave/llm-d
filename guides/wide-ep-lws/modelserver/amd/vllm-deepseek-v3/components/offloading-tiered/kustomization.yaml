apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# CPU + NVMe tiered KV cache offloading on prefill: host DRAM primary tier plus an fs NVMe
# secondary tier at /mnt/nvme-cache (base mounts it from hostPath /mnt/local/kv-cache). The
# prefill launch script builds a MultiConnector(MoRIIO + OffloadingConnector with a
# TieringOffloadingSpec) when OFFLOADING_MODE=tiered. Nodes without local NVMe should use
# offloading-cpu instead. Requires prefix caching (enabled in base).
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: add
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: OFFLOADING_MODE
          value: "tiered"
